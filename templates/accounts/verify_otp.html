{% extends 'base.html' %}


{% block title %}
Verify OTP
{% endblock %}



{% block content %}


<div class="container mt-5">


<div class="card p-4 mx-auto"
style="max-width:400px;">


<h3 class="text-center mb-4">
Verify OTP
</h3>



<form method="POST">

{% csrf_token %}



<label>
Enter OTP
</label>


<input 
type="text"
name="otp"
class="form-control mb-3"
maxlength="6"
required>



<button 
type="submit"
class="btn btn-success w-100">

Verify OTP

</button>



</form>


</div>


</div>


{% endblock %}
