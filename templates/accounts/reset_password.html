{% extends 'base.html' %}


{% block title %}
Reset Password
{% endblock %}



{% block content %}


<div class="container mt-5">


<div class="card p-4 mx-auto"
style="max-width:400px;">


<h3 class="text-center mb-4">
Create New Password
</h3>



<form method="POST">

{% csrf_token %}



<label>
New Password
</label>


<input
type="password"
name="password"
class="form-control mb-3"
required>



<label>
Confirm Password
</label>


<input
type="password"
name="confirm_password"
class="form-control mb-3"
required>



<button
type="submit"
class="btn btn-success w-100">

Reset Password

</button>


</form>


</div>


</div>


{% endblock %}
