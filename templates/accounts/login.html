

{% extends 'base.html' %}


{% block title %}
Login
{% endblock %}



{% block content %}


<div class="container mt-5">


<div class="card p-4 mx-auto"
style="max-width:400px;">


<h3 class="text-center mb-4">
Login
</h3>



<form method="POST">

{% csrf_token %}



<label>
Username
</label>

<input 
type="text"
name="username"
class="form-control mb-3"
required>



<label>
Password
</label>

<input 
type="password"
name="password"
class="form-control mb-3"
required>



<button 
type="submit"
class="btn btn-primary w-100">

Login

</button>
<div class="text-center mt-3">

<a href="{% url 'forgot_password' %}">
    Forgot Password?
</a>

</div>


</form>


<hr>


<div class="text-center">

<a href="{% url 'register' %}">
Create Owner Account
</a>

</div>


</div>


</div>


{% endblock %}
