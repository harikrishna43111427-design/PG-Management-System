{% extends 'base.html' %}


{% block title %}
Forgot Password
{% endblock %}



{% block content %}


<div class="container mt-5">


<div class="card p-4 mx-auto"
style="max-width:400px;">


<h3 class="text-center">
Forgot Password
</h3>


<form method="POST">

{% csrf_token %}


<label>
Enter Registered Email
</label>


<input 
type="email"
name="email"
class="form-control mb-3"
required>


<button 
class="btn btn-primary w-100">

Send OTP

</button>


</form>


</div>


</div>


{% endblock %}
