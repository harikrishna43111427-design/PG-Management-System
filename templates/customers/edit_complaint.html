{% extends 'base.html' %}



{% block title %}
Edit Complaint
{% endblock %}



{% block content %}


<div class="container mt-4">


<div class="card shadow p-4"
style="max-width:500px;">



<h3>
Edit Complaint
</h3>



<form method="POST">


{% csrf_token %}




<label>
Title
</label>


<input type="text"
name="title"
value="{{ complaint.title }}"
class="form-control mb-3"
required>




<label>
Description
</label>


<textarea
name="message"
class="form-control mb-3"
rows="5"
required>{{ complaint.message }}</textarea>





<button class="btn btn-success">

Update Complaint

</button>



</form>


</div>


</div>


{% endblock %}
